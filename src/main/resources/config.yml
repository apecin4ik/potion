# ВАШИ ЗЕЛЬЯ. Выдача: /ei give <ник> <id> [кол-во]  (или /baf give ...)
# Эффекты: "ТИП;ТИКИ;УРОВЕНЬ"   (20 тиков = 1 сек; уровень 0 = I, 1 = II, 2 = III, 3 = IV, 4 = V)
# lore - то, что видит игрок при наведении на зелье (пишите вручную, под эффекты)
settings:
  particles: false      # частицы эффектов
  icon: false           # иконка эффекта в углу экрана
  # В каких инвентарях можно держать баф-зелья (кроме инвентаря игрока).
  # Всё остальное (наковальня, верстак, печь, воронка, торговля и т.д.) запрещено.
  allowed-inventories:
    - CHEST
    - ENDER_CHEST

messages:
  prefix: "&8[&6Баф&8] "
  already-active: "&cУ вас уже действует баф! Подождите ещё &e%seconds% сек."
  cant-put: "&cЭто зелье можно хранить только в инвентаре, сундуке и эндер-сундуке."
  no-permission: "&cНет прав."
  usage: "&eИспользование: &f/ei give <ник> <id> [кол-во] &7| &f/ei reload"
  player-not-found: "&cИгрок не найден."
  item-not-found: "&cТакого баффа нет. Доступные: &f%list%"
  given: "&aВыдано &f%amount% &aшт. &f%item% &aигроку &f%player%"
  received: "&aВы получили баф-зелье."
  reloaded: "&aКонфиг перезагружен. Баффов: &f%count%"

